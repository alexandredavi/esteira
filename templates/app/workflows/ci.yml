name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (inclui a regra do Design System)
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Build
        run: npm run build
